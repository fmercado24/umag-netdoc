# Servicios opcionales. Con SQLite y sin monitoreo no hace falta nada de esto.
#
# Base PostgreSQL (cuando se migre de SQLite):
#   docker compose up -d db adminer
#   NETDOC_DATABASE_URL=postgresql+psycopg://netdoc:netdoc@localhost:5432/umag_netdoc
#
# Monitoreo (Prometheus + blackbox + Alertmanager + Grafana), ver docs/integraciones.md:
#   NETDOC_API_HOST=0.0.0.0 ./iniciar.sh      # NetDoc visible para los contenedores
#   docker compose --profile monitoreo up -d
#   Grafana en http://localhost:3000 (admin / NETDOC_GRAFANA_CLAVE), panel "NetDoc".
#
services:
  db:
    image: postgres:16-alpine
    container_name: netdoc-db
    profiles: [postgres]
    environment:
      POSTGRES_USER: netdoc
      POSTGRES_PASSWORD: netdoc
      POSTGRES_DB: umag_netdoc
      TZ: America/Punta_Arenas
    ports:
      - "5432:5432"
    volumes:
      - netdoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netdoc -d umag_netdoc"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: netdoc-adminer
    profiles: [postgres]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  # --- Perfil "monitoreo" --------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: netdoc-prometheus
    profiles: [monitoreo]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/reglas.yml:/etc/prometheus/reglas.yml:ro
      - netdoc_prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  # Ping (ICMP) a cada elemento que Prometheus descubre en el inventario.
  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    container_name: netdoc-blackbox
    profiles: [monitoreo]
    volumes:
      - ./deploy/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    cap_add:
      - NET_RAW

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: netdoc-alertmanager
    profiles: [monitoreo]
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: netdoc-grafana
    profiles: [monitoreo]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${NETDOC_GRAFANA_CLAVE:-cambiar}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - netdoc_grafana:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  netdoc_pgdata:
  netdoc_prometheus:
  netdoc_grafana:
