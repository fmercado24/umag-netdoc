# Servicios opcionales. Con SQLite y sin monitoreo no hace falta nada de esto.
#
# Las contraseñas y el token salen de .env (no versionado) y no tienen valor por
# omisión: sin ellos, el servicio que los necesita no arranca. Todo se publica
# solo en 127.0.0.1, porque Prometheus y Alertmanager no piden credenciales y
# muestran las IP del inventario; desde otro equipo, con un túnel SSH:
#   ssh -L 3000:localhost:3000 -L 9090:localhost:9090 usuario@servidor
#
# Base PostgreSQL (cuando se migre de SQLite), con NETDOC_POSTGRES_CLAVE en .env:
#   docker compose --profile postgres up -d db adminer
#   NETDOC_DATABASE_URL=postgresql+psycopg://netdoc:<clave>@localhost:5432/umag_netdoc
#
# Monitoreo (Prometheus + blackbox + Alertmanager + Grafana), ver docs/integraciones.md,
# con NETDOC_MONITOREO_TOKEN y NETDOC_GRAFANA_CLAVE en .env:
#   NETDOC_API_HOST=0.0.0.0 ./iniciar.sh      # NetDoc por HTTPS, visible para los contenedores
#   docker compose --profile monitoreo up -d
#   Grafana en http://localhost:3000 (admin / NETDOC_GRAFANA_CLAVE), panel "NetDoc".
#
services:
  db:
    image: postgres:16-alpine
    container_name: netdoc-db
    profiles: [postgres]
    environment:
      POSTGRES_USER: netdoc
      POSTGRES_PASSWORD: ${NETDOC_POSTGRES_CLAVE:-}
      POSTGRES_DB: umag_netdoc
      TZ: America/Punta_Arenas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - netdoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netdoc -d umag_netdoc"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: netdoc-adminer
    profiles: [postgres]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  # --- Perfil "monitoreo" --------------------------------------------------
  # NetDoc debe haber arrancado antes con NETDOC_API_HOST=0.0.0.0: es lo que
  # genera backend/certs/netdoc.crt, con el que se lo reconoce.
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: netdoc-prometheus
    profiles: [monitoreo]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/reglas.yml:/etc/prometheus/reglas.yml:ro
      - ./backend/certs/netdoc.crt:/etc/prometheus/netdoc.crt:ro
      - netdoc_prometheus:/prometheus
    secrets:
      - netdoc_monitoreo_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  # Ping (ICMP) a cada elemento que Prometheus descubre en el inventario.
  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    container_name: netdoc-blackbox
    profiles: [monitoreo]
    volumes:
      - ./deploy/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    cap_add:
      - NET_RAW

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: netdoc-alertmanager
    profiles: [monitoreo]
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./backend/certs/netdoc.crt:/etc/alertmanager/netdoc.crt:ro
    secrets:
      - netdoc_monitoreo_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: netdoc-grafana
    profiles: [monitoreo]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/netdoc_grafana_clave
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - netdoc_grafana:/var/lib/grafana
    secrets:
      - netdoc_grafana_clave
    ports:
      - "127.0.0.1:3000:3000"

secrets:
  netdoc_monitoreo_token:
    environment: NETDOC_MONITOREO_TOKEN
  netdoc_grafana_clave:
    environment: NETDOC_GRAFANA_CLAVE

volumes:
  netdoc_pgdata:
  netdoc_prometheus:
  netdoc_grafana:
